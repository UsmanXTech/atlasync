# Forge app definition for Atlasync.
# app.id is the registered Forge app id (assigned by `forge register`).
# Never invent or hand-edit a real app id.
modules:
  llm:
    - key: atlasync-llm
      model:
        - claude
  jira:projectPage:
    - key: atlasync-project-page
      resource: main
      resolver:
        function: resolver
      title: Atlasync
      layout: basic
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/atlasync
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:confluence-content.all
    - read:confluence-content.summary
    - write:confluence-content
    - read:confluence-space.summary
    - read:page:confluence
    - read:servicedesk-request
    # v2.1.0 (forge lint, 2026-11-21): endpoints used by diagnostics + agent tools
    - read:jira-user
    - read:space:confluence
    - search:confluence
    - write:page:confluence
    - storage:app
    # NOTE (2026-11-21): the plan's `read:dev-status:jira` is NOT a real
    # scope — the manifest validator rejects it. Dev-status reads are
    # already covered by `read:jira-work` (the existing getIssueDevStatus
    # resolver uses it; verified by the 2026-11-05 probe).
app:
  id: ari:cloud:ecosystem::app/63accaf9-e952-4554-af92-27b5b1b5d56d
  runtime:
    name: nodejs24.x
