# Forge app definition for Atlasync.
# app.id is the registered Forge app id (assigned by `forge register`).
# Never invent or hand-edit a real app id.
modules:
  jira:projectPage:
    - key: atlasync-project-page
      resource: main
      resolver:
        function: resolver
      title: Atlasync
      layout: basic
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/atlasync
permissions:
  scopes:
    - read:jira-work
    - read:confluence-content.all
    - read:confluence-space.summary
    - read:servicedesk-request
    - storage:app
app:
  id: ari:cloud:ecosystem::app/63accaf9-e952-4554-af92-27b5b1b5d56d
  runtime:
    name: nodejs24.x
