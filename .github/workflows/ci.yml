# Minimal, reliable CI for Atlasync.
# Runs on every push to main and every pull request: clean install, build, tests.
# Node 22 is an active LTS and satisfies Vite 6 + React 19 + TypeScript 5.8.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
